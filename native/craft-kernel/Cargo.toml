[package]
name = "frozen-rabbit-craft-kernel"
version = "0.1.0"
edition = "2024"
publish = false
description = "Dependency-free FFXIV craft mechanics and state-feedback solver kernel"
license = "MIT AND BSD-3-Clause"
repository = "https://github.com/emu-rabbit/frozen_rabbit_cosmic"
readme = "README.md"
keywords = ["ffxiv", "crafting", "solver"]
categories = ["algorithms", "games"]
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "craft-kernel-rollout-batch"
path = "src/bin/craft-kernel-rollout-batch.rs"

[[bin]]
name = "craft-kernel-adaptive-policy-matrix"
path = "src/bin/craft-kernel-adaptive-policy-matrix.rs"

[[bin]]
name = "craft-kernel-generic-episode"
path = "src/bin/craft-kernel-generic-episode.rs"

[[bin]]
name = "craft-kernel-candidate-dataset"
path = "src/bin/craft-kernel-candidate-dataset.rs"

[[bin]]
name = "craft-kernel-candidate-teacher-probe"
path = "src/bin/craft-kernel-candidate-teacher-probe.rs"

[[bin]]
name = "craft-kernel-candidate-teacher-episode"
path = "src/bin/craft-kernel-candidate-teacher-episode.rs"

[[bin]]
name = "craft-kernel-candidate-teacher-consensus-episode"
path = "src/bin/craft-kernel-candidate-teacher-consensus-episode.rs"

[dependencies]
