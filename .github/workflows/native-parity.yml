name: Native kernel parity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-parity:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.tmp/cargo-target
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Check native formatting
        run: cargo fmt --manifest-path native/craft-kernel/Cargo.toml --check

      - name: Test native kernel
        run: cargo test --locked --all-targets --manifest-path native/craft-kernel/Cargo.toml

      - name: Build native release binaries
        run: cargo build --locked --release --manifest-path native/craft-kernel/Cargo.toml

      - name: Type-check parity bridge
        run: npx tsc -p tools/native-parity/tsconfig.json

      - name: Require cross-language parity
        run: npm run test:native-parity

      - name: Require adaptive policy cross-language parity
        run: npm run test:native-adaptive-policy-parity
